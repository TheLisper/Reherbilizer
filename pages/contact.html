  <main id="main">
    <section class="contact">
      <h2>Contact Us</h2>
      <p>If you have any questions or would like to get in touch, please fill out the form below:</p>
      <form id="contact-form" action="https://formsubmit.co/you@example.com" method="post" novalidate>
        <div><label for="name">Name:</label>
        <input type="text" id="name" name="name" required minlength="2" maxlength="60" autocomplete="name"><span class="error" id="name-error" role="alert"></span></div>
        <div><label for="email">Email:</label>
        <input type="email" id="email" name="email" required autocomplete="email"><span class="error" id="email-error" role="alert"></span></div>
        <div><label for="phone">Phone (optional):</label>
        <input type="tel" id="phone" name="phone" pattern="(\+27|0)[6-8][0-9]{8}" autocomplete="tel"><span class="error" id="phone-error" role="alert"></span></div>
        <div><label for="type">Type of message:</label>
        <select id="type" name="type" required><option value="">Choose one</option><option>General question</option><option>Refer a young person</option><option>Feedback</option><option>Media</option></select><span class="error" id="type-error" role="alert"></span></div>
        <div><label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required minlength="10" maxlength="1000"></textarea><span class="error" id="message-error" role="alert"></span></div>
        <button type="submit">Send Message</button>
      </form>
      <div id="status" class="status" tabindex="-1" hidden></div>
      <div id="map" role="region" aria-label="Map showing our location"></div>
    </section>
  </main>
